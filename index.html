<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica DevOps CI/CD</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      background: white;
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    h1 { color: #2c3e50; }
    p { color: #555; font-size: 18px; }
    .status { color: green; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Aplicación DevOps</h1>
    <p>Mi aplicación se despliega automáticamente mediante CI/CD.</p>
    <p class="status">Sistema funcionando correctamente</p>
    <p>¡Bienvenido a la práctica de DevOps CI/CD!</p>
  </div>
</body>
</html>
